[project]
name = "tsg-gateway"
version = "0.1.0"
description = "TSG Tax Gateway: connects ERP and eCommerce systems to tax calculators."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pymongo>=4.11",
    "structlog>=25.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.15",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsg_gateway"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "S", "ASYNC", "PT", "DTZ", "T20", "ERA", "PL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["tsg_gateway"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["tsg_gateway"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (Testcontainers MongoDB)",
    "e2e: needs the full local stack",
]

[tool.coverage.run]
source = ["tsg_gateway"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "tsg_gateway"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "tsg_gateway.entrypoints",
    "tsg_gateway.adapters",
    "tsg_gateway.application",
    "tsg_gateway.ports",
    "tsg_gateway.domain",
]

[[tool.importlinter.contracts]]
name = "Core stays free of I/O and cloud libraries"
type = "forbidden"
source_modules = ["tsg_gateway.domain", "tsg_gateway.application", "tsg_gateway.ports"]
forbidden_modules = ["fastapi", "httpx", "pymongo", "uvicorn", "azure", "boto3", "botocore"]
allow_indirect_imports = true
